name: Debug NPM Token v2
on: workflow_dispatch

jobs:
  deep-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: Token diagnostic
        run: |
          echo "=== token length: ${#NODE_AUTH_TOKEN} ==="
          echo "=== token prefix: ${NODE_AUTH_TOKEN:0:10} ==="
          echo "=== token suffix: ${NODE_AUTH_TOKEN: -10} ==="
          echo "=== npm config ==="
          npm config get registry
          echo "=== curl whoami with token ==="
          curl -s -w "\nHTTP %{http_code}\n" -H "Authorization: Bearer $NODE_AUTH_TOKEN" https://registry.npmjs.org/-/whoami
          echo "=== npm whoami ==="
          npm whoami 2>&1 || echo "whoami failed"
          echo "=== direct API call package info ==="
          curl -s -w "\nHTTP %{http_code}\n" -H "Authorization: Bearer $NODE_AUTH_TOKEN" https://registry.npmjs.org/paddleocr-js
          echo "=== Try npm publish dry-run ==="
          npm publish --dry-run 2>&1 | tail -5
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}