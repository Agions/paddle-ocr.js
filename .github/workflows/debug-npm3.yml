name: Debug NPM Token v3
on: workflow_dispatch

jobs:
  publish-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: token + publish test
        run: |
          echo "=== token length: ${#NODE_AUTH_TOKEN} ==="
          echo "=== token prefix: ${NODE_AUTH_TOKEN:0:10} ==="
          # 先 whoami 看账号
          npm whoami
          echo "=== npm profile ==="
          npm profile get 2>&1 | head -10
          # 看 publish 用的 package
          cd $GITHUB_WORKSPACE
          ls
          echo "=== package.json name/version ==="
          cat package.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'name={d[\"name\"]}, version={d[\"version\"]}')"
          # 准备一个最小 fake package 测试 publish 路径
          mkdir -p /tmp/test-pub
          cat > /tmp/test-pub/package.json << EOF
          {
            "name": "paddleocr-js",
            "version": "0.4.0-test-debug",
            "description": "debug",
            "main": "index.js",
            "license": "MIT"
          }
          EOF
          echo 'module.exports = {}' > /tmp/test-pub/index.js
          cd /tmp/test-pub
          echo "=== npm publish test version ==="
          npm publish --access public --tag test-debug 2>&1 | tail -20
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}